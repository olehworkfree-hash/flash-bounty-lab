name: FLASH bounded V2-V3 screen and actual fork swaps
on:
  push:
    branches: [flash/v3-screen-2026-09-08]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: flash-v3-screen-2026-09-08
  cancel-in-progress: true
jobs:
  unit-before-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Compile and test before all network experiments
        run: |
          set -euo pipefail
          mkdir -p evidence/real/2026-09-08
          (forge --version; anvil --version; cast --version) | tee evidence/real/2026-09-08/tools.txt
          forge build --sizes
          FOUNDRY_PROFILE=fork forge build --sizes
          python3 -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee evidence/real/2026-09-08/python-tests.log
          forge test -vvv | tee evidence/real/2026-09-08/unit-tests.log
          python3 scripts/anvil_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v3-unit-evidence
          path: evidence/real/2026-09-08/
          retention-days: 7
  real-screen-and-fork:
    needs: unit-before-network
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Fresh hash-pinned public RPC quorum
        run: python3 scripts/real_quorum.py --out evidence/real/2026-09-08/fresh-quorum.json
      - name: Bounded V2-V3 screen on the same block
        run: python3 scripts/v3_market_screen.py --quorum evidence/real/2026-09-08/fresh-quorum.json --out evidence/real/2026-09-08/v3-market-screen.json
      - name: Match V3 quotes with real swaps in local Anvil only
        run: python3 scripts/run_v3_fork.py --quorum evidence/real/2026-09-08/fresh-quorum.json --out-dir evidence/real/2026-09-08
      - name: Regression - Aave flash loans and V2 profit rejection
        run: bash scripts/run_real_validation.sh swaps
      - name: Regression - captured historical liquidation
        run: bash scripts/run_real_validation.sh liquidation
      - name: Exact source archive
        if: always()
        run: git archive --format=zip --output=flash-v3-tested-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v3-real-evidence
          path: |
            evidence/real/2026-09-08/
            evidence/real/2026-09-07/
            flash-v3-tested-source.zip
          retention-days: 7
          if-no-files-found: error
