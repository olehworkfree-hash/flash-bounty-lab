name: FLASH quorum Aave fork
on:
  push:
    branches: [flash/quorum-aave-fork-2026-09-05]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flash-quorum-aave-isolated
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Solidity compiler and mock EVM tests
        run: |
          forge --version
          anvil --version
          forge build
          forge test --match-contract FlashLoanProbeTest -vv
      - name: Actual loopback Anvil smoke test (not a fork)
        run: python3 scripts/anvil_smoke.py
  fork:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
          cache: false
      - name: Fresh three-provider quorum and actual Aave Anvil fork
        run: python3 scripts/run_fork_ci.py
