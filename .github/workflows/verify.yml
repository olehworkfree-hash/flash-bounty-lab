name: FLASH triangle screen and matched atomic fork
on:
  push:
    branches: [flash/triangle-match-2026-09-09]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: flash-triangle-match-2026-09-09
  cancel-in-progress: true
jobs:
  unit-before-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Compile both profiles and run all unit tests
        run: |
          set -euo pipefail
          mkdir -p evidence/triangle
          (forge --version; anvil --version; cast --version) | tee evidence/triangle/tools.txt
          forge build --sizes
          FOUNDRY_PROFILE=fork forge build --sizes
          python3 -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee evidence/triangle/python-tests.log
          forge test -vvv | tee evidence/triangle/unit-tests.log
          python3 scripts/anvil_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: triangle-unit-evidence
          path: evidence/triangle/
          retention-days: 7
  real-screen-and-matched-fork:
    needs: unit-before-network
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Real current quorum
        run: python3 scripts/real_quorum.py --out evidence/triangle/quorum.json
      - name: Three-hop screen - at most 512 quotes per source
        run: python3 scripts/triangle_screen.py --quorum evidence/triangle/quorum.json --out evidence/triangle/screen.json
      - name: Match exact selected routes, sizes and pools on local Anvil
        run: python3 scripts/run_triangle_fork.py --quorum evidence/triangle/quorum.json --screen evidence/triangle/screen.json --out-dir evidence/triangle/matched
      - name: Regression - prior two-hop V3 atomic integration
        run: python3 scripts/run_v3_atomic.py --quorum evidence/triangle/quorum.json --out-dir evidence/triangle/regression
      - name: Regression - previous V2 swaps and profit rejection
        run: bash scripts/run_real_validation.sh swaps
      - name: Regression - historical liquidation
        run: bash scripts/run_real_validation.sh liquidation
      - name: Exact source archive
        if: always()
        run: git archive --format=zip --output=flash-triangle-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: triangle-real-evidence
          path: |
            evidence/triangle/
            evidence/real/2026-09-07/
            flash-triangle-source.zip
          retention-days: 7
          if-no-files-found: error
