name: FLASH EVM verification

on:
  push:
    branches:
      - flash/evm-verification-2026-09-05
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flash-evm-$
  cancel-in-progress: true

jobs:
  unit-and-local-anvil:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Foundry v1.8.1
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Record tool versions
        run: |
          forge --version
          cast --version
          anvil --version
      - name: Compile Solidity
        run: forge build --sizes
      - name: Run mock EVM tests
        run: forge test --match-contract FlashLoanProbeTest -vvv
      - name: Start and verify a real loopback Anvil node
        run: python3 scripts/anvil_smoke.py

  pinned-arbitrum-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Foundry v1.8.1
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Execute actual Aave flash-loan repayment on isolated pinned fork
        env:
          ARBITRUM_RPC_URL: https://arb1.arbitrum.io/rpc
          FORK_BLOCK: "501964988"
        run: bash scripts/anvil_fork_smoke.sh
