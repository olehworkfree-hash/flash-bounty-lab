name: FLASH EVM verification
on:
  push:
    branches: [main, flash/evm-verification-2026-09-05]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flash-evm-verification
  cancel-in-progress: true
jobs:
  unit-and-local-anvil:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Record tool versions
        run: forge --version && cast --version && anvil --version
      - name: Compile Solidity
        run: forge build --sizes
      - name: Run mock EVM tests
        run: forge test --match-contract FlashLoanProbeTest -vvv
      - name: Verify local Anvil
        run: python3 scripts/anvil_smoke.py
  pinned-arbitrum-fork:
    needs: unit-and-local-anvil
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Aave plus actual AMM code on isolated fork
        env:
          FORK_BLOCK: '501964988'
        run: bash scripts/anvil_fork_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-fork-evidence
          path: |
            fork-tests.log
            evidence/real/anvil/*.json
            anvil-fork-*.log
          retention-days: 7
          if-no-files-found: warn
