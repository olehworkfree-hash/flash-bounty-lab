name: FLASH triangle compilation repair and real fork
on:
  push:
    branches: [flash/triangle-compile-fix-2026-09-10]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: flash-triangle-compile-fix-2026-09-10
  cancel-in-progress: true
jobs:
  unit-before-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Compile both profiles and run all offline tests
        run: |
          set -euo pipefail
          mkdir -p evidence/real/2026-09-10
          (forge --version; anvil --version; cast --version) | tee evidence/real/2026-09-10/tools.txt
          forge build --sizes 2>&1 | tee evidence/real/2026-09-10/default-build.log
          FOUNDRY_PROFILE=fork forge build --sizes 2>&1 | tee evidence/real/2026-09-10/fork-build.log
          python3 -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee evidence/real/2026-09-10/python-tests.log
          forge test -vvv 2>&1 | tee evidence/real/2026-09-10/unit-tests.log
          python3 scripts/anvil_smoke.py
      - name: Preserve exact source even if a gate fails
        if: always()
        run: git archive --format=zip --output=flash-triangle-tested-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: triangle-unit-evidence
          path: |
            evidence/real/2026-09-10/
            flash-triangle-tested-source.zip
          retention-days: 7
  real-screen-and-fork:
    needs: unit-before-network
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Fresh read-only quorum
        run: python3 scripts/real_quorum.py --out evidence/real/2026-09-10/quorum.json
      - name: Triangular paths - bounded complete-provider agreement
        run: python3 scripts/triangle_screen.py --quorum evidence/real/2026-09-10/quorum.json --out evidence/real/2026-09-10/triangle-screen.json
      - name: Selected triangle - quote match and Aave repayment profit gate
        run: python3 scripts/run_triangle_fork.py --quorum evidence/real/2026-09-10/quorum.json --screen evidence/real/2026-09-10/triangle-screen.json --out-dir evidence/real/2026-09-10
      - name: Same-block two-leg V2 and V3 comparison
        run: python3 scripts/bounded_screen.py --quorum evidence/real/2026-09-10/quorum.json --out evidence/real/2026-09-10/two-leg-screen.json
      - name: Existing atomic V3 regression
        run: python3 scripts/run_v3_atomic.py --quorum evidence/real/2026-09-10/quorum.json --out-dir evidence/real/2026-09-10
      - name: Existing actual V3 swaps regression
        run: python3 scripts/run_v3_fork.py --quorum evidence/real/2026-09-10/quorum.json --out-dir evidence/real/2026-09-10
      - name: Existing V2 profit rejection
        run: bash scripts/run_real_validation.sh swaps
      - name: Existing historical liquidation regression
        run: bash scripts/run_real_validation.sh liquidation
      - name: Exact source archive
        if: always()
        run: git archive --format=zip --output=flash-triangle-tested-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: triangle-network-evidence
          path: |
            evidence/real/2026-09-10/
            evidence/real/2026-09-07/
            flash-triangle-tested-source.zip
          retention-days: 7
          if-no-files-found: error
